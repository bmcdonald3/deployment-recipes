services:
  vault:
    image: docker.io/library/vault:1.13.3
    container_name: vault
    hostname: vault
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    networks:
      - internal

  vault-init:
    image: docker.io/library/vault:1.13.3
    container_name: vault-init
    hostname: vault-init
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
    depends_on:
      vault:
        condition: service_started
    networks:
      - internal
    command: >
      sh -c "
        echo 'Waiting for Vault to be ready...' &&
        until vault status -address=${VAULT_ADDR} > /dev/null 2>&1; do
          sleep 1;
        done &&
        echo 'Vault is ready. Enabling KV store...' &&
        vault secrets enable -path=secret kv-v2 || echo 'KV store at path secret already enabled or error.' &&
        vault kv put secret/hms-creds placeholder=placeholder-value || echo 'Secret secret/hms-creds already exists or error.' &&
        echo 'Vault initialization complete.'
      "
